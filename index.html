<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage with Header, Body, and Footer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color:rgba(19, 18, 18, 0);
        }
        
        
        body {
            background-image: url('images (2).jpeg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: rgb(252, 7, 7);
            background-color:rgba(19, 18, 18, 0);
        }
        
        
        header {
            background-image: url('images (1).jpeg'); 
            background-size: cover;
            background-position: center;
            color: rgb(10, 23, 212);
            padding: 60px 0;
            text-align: center;
        }
        
        header h1 {
            font-size: 3em;
        }
        
        nav ul {
            list-style: none;
            padding: 0;
        }
        
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        
        nav ul li a {
            color: rgb(238, 166, 12);
            text-decoration: none;
            font-size: 1.2em;
            
        }

        nav a:hover {
            color: green;
             transform: scale(1.1); /* Slight zoom effect on hover */
        }

        nav ul li a:hover {
            text-decoration: underline;
        }
        
        main {
            padding: 20px;
            text-align: center;
        }
        
        main section {
            margin-bottom: 40px;
        }
        
        main h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        main p {
            font-size: 1.2em;
        }
        
        
        footer {
            background-size: cover;
            background-position: center;
            color: rgb(15, 245, 7);
            padding: 40px 0;
            text-align: center;
        }
        
        footer .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            text-align: center;
        }
        
        footer p {
            margin: 0;
            font-size: 1em;
        }
        
        footer nav ul {
            list-style: none;
            padding: 0;
        }
        
        footer nav ul li {
            display: inline;
            margin: 0 15px;
        }
        
        footer nav ul li a {
            color: rgba(221, 16, 187, 0.904);
            text-decoration: none;
            font-size: 1em;
        }
        
        footer nav ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Welcome to My Website</h1>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="home">
            <h2>Home Section</h2>
            <p>This is the home section of the website.</p>
        </section>

        <section id="about">
            <h2>About Section</h2>
            <p>Learn more about us in this section.</p>
        </section>

        <section id="services">
            <h2>Services Section</h2>
            <p>We offer amazing services.</p>
        </section>

        <section id="contact">
            <h2>Contact Section</h2>
            <p>Get in touch with us here.</p>
        </section>
    </main>
</body>
</html>
